<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Post — BlogPlatform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script>
    validateSession().then(ok => {
        if (!ok) {
            window.location.href = '/login';
            return;
        }
        renderNavbar();
        loadDrafts();   // or whatever the page's init function is
    });
</script>

<div class="container">
    <h1 id="page-title" style="margin-bottom:1.5rem;">New Post</h1>

    <form id="post-form" onsubmit="submitPost(event)">
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="post-title" required minlength="3" maxlength="200">
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="post-category" required>
                <option value="">Loading categories...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tags</label>
            <div id="tag-picker" class="tag-picker">
                <div class="empty-tags">Loading tags...</div>
            </div>
            <div class="tag-create">
                <input type="text" id="new-tag-input" placeholder="New tag name..."
                       onkeydown="if(event.key==='Enter'){event.preventDefault();createAndSelectTag();}">
                <button type="button" class="btn btn-sm btn-secondary" onclick="createAndSelectTag()">+ Add tag</button>
            </div>
            <div class="form-hint">Click a tag to select it. New tags are created instantly.</div>
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea id="post-content" required minlength="10" placeholder="Write your post content here..."></textarea>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="post-status">
                <option value="DRAFT">Draft</option>
                <option value="PUBLISHED">Published</option>
            </select>
        </div>

        <div style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn">Save Post</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let editingId = null;

    if (pathParts.length === 3 && pathParts[2] === 'edit') {
        editingId = pathParts[1];
        document.getElementById('page-title').textContent = 'Edit Post';
    }

    let allTags = [];
    const selectedTagIds = new Set();

    async function loadCategories() {
        try {
            const cats = await apiFetch('/api/v1/categories') || [];
            const select = document.getElementById('post-category');
            if (cats.length === 0) {
                select.innerHTML = '<option value="">No categories — create one first</option>';
                return;
            }
            select.innerHTML = '<option value="">Select a category</option>' +
                cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        } catch (err) {
            showToast('Failed to load categories: ' + err.message, 'error');
        }
    }

    async function loadTags() {
        try {
            allTags = await apiFetch('/api/v1/tags') || [];
            renderTagPicker();
        } catch (err) {
            document.getElementById('tag-picker').innerHTML =
                `<div class="empty-tags">Failed to load tags: ${err.message}</div>`;
        }
    }

    function renderTagPicker() {
        const picker = document.getElementById('tag-picker');
        if (!allTags.length) {
            picker.innerHTML = '<div class="empty-tags">No tags yet — create one below.</div>';
            return;
        }
        picker.innerHTML = allTags.map(t => `
            <button type="button"
                    class="tag-chip ${selectedTagIds.has(t.id) ? 'selected' : ''}"
                    onclick="toggleTag('${t.id}')">#${escapeHtml(t.name)}</button>
        `).join('');
    }

    function toggleTag(id) {
        if (selectedTagIds.has(id)) selectedTagIds.delete(id);
        else selectedTagIds.add(id);
        renderTagPicker();
    }

    async function createAndSelectTag() {
        const input = document.getElementById('new-tag-input');
        const name = input.value.trim();
        if (!name) return;

        try {
            const created = await apiFetch('/api/v1/tags', {
                method: 'POST',
                body: JSON.stringify({ names: [name] })
            });
            // Refresh full list to stay in sync
            allTags = await apiFetch('/api/v1/tags') || [];
            (created || []).forEach(t => selectedTagIds.add(t.id));
            input.value = '';
            renderTagPicker();
            showToast('Tag created', 'success');
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    async function loadPostForEdit() {
        try {
            const p = await apiFetch(`/api/v1/posts/${editingId}`);
            document.getElementById('post-title').value = p.title;
            document.getElementById('post-content').value = p.content;
            document.getElementById('post-status').value = p.status;
            setTimeout(() => {
                document.getElementById('post-category').value = p.category?.id || '';
            }, 300);
            (p.tags || []).forEach(t => selectedTagIds.add(t.id));
            renderTagPicker();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    async function submitPost(e) {
        e.preventDefault();

        const payload = {
            title: document.getElementById('post-title').value,
            content: document.getElementById('post-content').value,
            categoryId: document.getElementById('post-category').value,
            status: document.getElementById('post-status').value,
            tagIds: [...selectedTagIds]
        };

        try {
            if (editingId) {
                await apiFetch(`/api/v1/posts/${editingId}`, {
                    method: 'PATCH',
                    body: JSON.stringify(payload)
                });
                showToast('Post updated!', 'success');
                setTimeout(() => window.location.href = `/posts/${editingId}`, 800);
            } else {
                const created = await apiFetch('/api/v1/posts', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showToast('Post created!', 'success');
                setTimeout(() => window.location.href = `/posts/${created.id}`, 800);
            }
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    loadCategories().then(() => {
        loadTags().then(() => {
            if (editingId) loadPostForEdit();
        });
    });
</script>
</body>
</html>
