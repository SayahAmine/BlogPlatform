<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — BlogPlatform</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-container">
    <h1 style="text-align:center; margin-bottom: 2rem;">📝 BlogPlatform</h1>

    <div class="auth-tabs">
        <button id="tab-login" class="active" onclick="switchTab('login')">Login</button>
        <button id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login form -->
    <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn" style="width:100%">Login</button>
    </form>

    <!-- Register form -->
    <form id="register-form" onsubmit="handleRegister(event)" style="display:none">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="reg-name" required minlength="2">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" required minlength="6">
        </div>
        <button type="submit" class="btn" style="width:100%">Create account</button>
    </form>
</div>

<script src="/js/api.js"></script>
<script>
    // If already logged in, go home
    if (Auth.isLoggedIn()) window.location.href = '/';

    function switchTab(tab) {
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register').classList.toggle('active', tab === 'register');
        document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    }

    async function handleLogin(e) {
        e.preventDefault();
        try {
            const data = await apiFetch('/api/v1/auth/login', {
                method: 'POST',
                body: JSON.stringify({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                })
            });
            Auth.saveToken(data.token, data.user);
            window.location.href = '/';
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        try {
            await apiFetch('/api/v1/auth/register', {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value
                })
            });
            showToast('Account created! Please log in.', 'success');
            switchTab('login');
            document.getElementById('login-email').value = document.getElementById('reg-email').value;
        } catch (err) {
            showToast(err.message, 'error');
        }
    }
</script>
</body>
</html>
